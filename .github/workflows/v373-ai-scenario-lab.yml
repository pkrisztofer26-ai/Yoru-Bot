name: Yoru v3.73 AI Scenario Lab PoC

on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model ID
        required: true
        default: openai/gpt-oss-120b
      reasoning_effort:
        description: GPT-OSS reasoning effort
        required: true
        type: choice
        options:
          - low
          - medium
          - high
        default: low

permissions:
  contents: read

concurrency:
  group: yoru-v373-ai-scenario-lab
  cancel-in-progress: false

jobs:
  ai-scenario-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Runner self-test and dry-run
        run: |
          python -m py_compile .ci/v373_ai_scenario_lab/runner.py
          python .ci/v373_ai_scenario_lab/runner.py --dry-run --batch-size 5 --model "${{ inputs.model }}" --reasoning-effort "${{ inputs.reasoning_effort }}"

      - name: Require Groq secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing repository secret GROQ_API_KEY"
            exit 1
          fi

      - name: Probe Groq model access
        env:
          MODEL: ${{ inputs.model }}
        run: |
          mkdir -p artifacts/ai_scenario_lab
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          out = pathlib.Path("artifacts/ai_scenario_lab")
          model = os.environ["MODEL"]
          key = os.environ["GROQ_API_KEY"]
          body = {
              "model": model,
              "messages": [{"role": "user", "content": "Válaszolj pontosan: OK"}],
              "max_completion_tokens": 8,
          }
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              report = {
                  "status": "PASS",
                  "model": model,
                  "http_status": 200,
                  "response_id": payload.get("id", ""),
              }
              print(f"Groq probe PASS: model={model}")
              print("response_id=", payload.get("id", ""))
              out.joinpath("GROQ_PROBE_RESULT.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
              out.joinpath("GROQ_PROBE_RESULT.txt").write_text(f"STATUS: PASS\nmodel={model}\nhttp_status=200\nresponse_id={payload.get('id','')}\n", encoding="utf-8")
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", "replace")
              try:
                  parsed = json.loads(error_body)
              except Exception:
                  parsed = {"raw": error_body[:4000]}
              report = {
                  "status": "FAIL",
                  "model": model,
                  "http_status": exc.code,
                  "reason": str(exc.reason),
                  "groq_error": parsed,
              }
              text = f"STATUS: FAIL\nmodel={model}\nhttp_status={exc.code}\nreason={exc.reason}\nerror_body={error_body[:4000]}\n"
              out.joinpath("GROQ_PROBE_RESULT.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
              out.joinpath("GROQ_PROBE_RESULT.txt").write_text(text, encoding="utf-8")
              print(f"Groq probe FAIL: HTTP {exc.code} {exc.reason}")
              print(error_body[:4000])
              raise SystemExit(1)
          PY

      - name: Run AI Scenario Lab
        run: python .ci/v373_ai_scenario_lab/runner.py --batch-size 5 --model "${{ inputs.model }}" --reasoning-effort "${{ inputs.reasoning_effort }}" --out-dir artifacts/ai_scenario_lab

      - name: Print report
        if: always()
        run: |
          if [ -f artifacts/ai_scenario_lab/GROQ_PROBE_RESULT.txt ]; then
            echo "--- Groq probe ---"
            cat artifacts/ai_scenario_lab/GROQ_PROBE_RESULT.txt
          fi
          if [ -f artifacts/ai_scenario_lab/YORU_AI_SCENARIO_LAB_RESULT.txt ]; then
            echo "--- AI Lab ---"
            cat artifacts/ai_scenario_lab/YORU_AI_SCENARIO_LAB_RESULT.txt
          fi

      - name: Upload lab artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yoru-v373-ai-scenario-lab
          path: |
            artifacts/ai_scenario_lab/*.json
            artifacts/ai_scenario_lab/*.txt
            artifacts/ai_scenario_lab/*.csv
          if-no-files-found: warn
          retention-days: 14
