name: Yoru v3.83.6 W22.4.2 Tier 2 Proof
run-name: W22.4.2 exact source and live review proof

on:
  push:
    branches:
      - ci/v3834-ai-director-tier2-context
    paths:
      - .ci/v3834_ai_director_context/SOURCE_TRANSFER_TRIGGER

permissions:
  contents: read

jobs:
  source-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout W22.4.2 proof branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3834-ai-director-tier2-context
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install proof dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Run exact W22.4.2 proof
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .ci/v3836_ai_director_context_hardening/run_review.sh
      - name: Upload W22.4.2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-v3836-w22-4-2-tier2-context-human-qa-hardening
          path: .ci/v3836_ai_director_context_hardening/
          if-no-files-found: warn
          retention-days: 30
