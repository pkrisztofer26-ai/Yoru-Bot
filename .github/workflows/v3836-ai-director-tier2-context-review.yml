name: Yoru v3.83.6 W22.4.2 Tier 2 Context Human-QA Hardening
run-name: W22.4.2 Tier 2 hardened non-player context review

on:
  push:
    branches:
      - ci/v3834-ai-director-tier2-context
    paths:
      - .ci/v3836_ai_director_context_hardening/TRIGGER

permissions:
  contents: read

jobs:
  context-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated W22.4.2 proof branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3834-ai-director-tier2-context

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify exact W22.4.1 base and W22.4.2 patch
        run: |
          set -euo pipefail
          python .ci/v3836_ai_director_context_hardening/verify_base.py | tee /tmp/base_verify.log
          grep -q 'W22_4_2_BASE_VERIFY=PASS' /tmp/base_verify.log
          grep -q 'BASE_SOURCE_SHA256=5/5 PASS' /tmp/base_verify.log
          grep -q 'HARDENING_PATCH_SHA256=PASS' /tmp/base_verify.log
          grep -q 'HUMAN_QA_REGRESSIONS=3/3 ENCODED' /tmp/base_verify.log
          cp /tmp/base_verify.log .ci/v3836_ai_director_context_hardening/base_verify.log

      - name: Build exact W22.4.2 runtime projection
        run: |
          set -euo pipefail
          GATE=.ci/v3836_ai_director_context_hardening
          BASE=.ci/v3834_ai_director_context/source
          W22BASE=.ci/v3831_ai_director_review/frozen
          RUN="$GATE/runtime"
          rm -rf "$RUN"
          mkdir -p "$RUN/app/providers" "$RUN/app/services" "$RUN/scripts" "$RUN/tests"
          cp "$W22BASE/app/__init__.py" "$RUN/app/__init__.py"
          cp "$W22BASE/app/ai_director.py" "$RUN/app/ai_director.py"
          cp "$W22BASE/app/ai_director_config.py" "$RUN/app/ai_director_config.py"
          cp "$W22BASE/app/providers/__init__.py" "$RUN/app/providers/__init__.py"
          cp "$W22BASE/app/providers/ai_director_groq.py" "$RUN/app/providers/ai_director_groq.py"
          cp "$BASE/app/ai_director_context.py" "$RUN/app/ai_director_context.py"
          cp "$BASE/app/services/ai_director_context.py" "$RUN/app/services/ai_director_context.py"
          touch "$RUN/app/services/__init__.py"
          cp "$BASE/app/providers/ai_director_context_groq.py" "$RUN/app/providers/ai_director_context_groq.py"
          cp "$BASE/scripts/ai_director_tier2_context_review.py" "$RUN/scripts/ai_director_tier2_context_review.py"
          cp "$BASE/tests/test_w22_4_context_core_ci.py" "$RUN/tests/test_w22_4_context_core_ci.py"
          (cd "$RUN" && patch -p1 < "$GITHUB_WORKSPACE/$GATE/w2242.patch")

      - name: Verify W22.4.2 post-patch source hashes
        run: |
          set -euo pipefail
          RUN=.ci/v3836_ai_director_context_hardening/runtime
          echo 'bb0467990316d04c769ef6c7fdaaea0d86d6d9e70033d1adfd39560c777d610b  '"$RUN/app/ai_director_context.py" | sha256sum -c -
          echo '49f6210ceca7e351c26405495fcca39f299fd3a5825f3f7a4e685702155bec12  '"$RUN/app/services/ai_director_context.py" | sha256sum -c -
          echo '16ecd246c2e9e695a334b79688699e3e682374c70a65a0c6998b8edf1fd9aec8  '"$RUN/app/providers/ai_director_context_groq.py" | sha256sum -c -
          echo 'bc00ab5c522e296b0539fc3286397bee29c09dab5b50a629983b2ea5936793de  '"$RUN/scripts/ai_director_tier2_context_review.py" | sha256sum -c -
          echo '73eeadf2e7e2fd6e6065a82679bd303629664f17fc8d4d54ccc789cd86104875  '"$RUN/tests/test_w22_4_context_core_ci.py" | sha256sum -c -
          echo 'POST_PATCH_SOURCE_SHA256=5/5 PASS' | tee .ci/v3836_ai_director_context_hardening/post_patch_verify.log

      - name: Install proof dependency
        run: python -m pip install 'pytest>=8,<10'

      - name: Run W22.4.2 Tier 2 core contracts
        working-directory: .ci/v3836_ai_director_context_hardening/runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_w22_4_context_core_ci.py | tee ../core_pytest.log
          grep -Eq '30 passed' ../core_pytest.log
          if grep -Eqi '[1-9][0-9]* skipped|[1-9][0-9]* failed|[1-9][0-9]* error' ../core_pytest.log; then exit 1; fi

      - name: Run deterministic W22.4.2 fixture review
        working-directory: .ci/v3836_ai_director_context_hardening/runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ai_director_tier2_context_review.py --mode fixture --output ../fixture_review
          cat ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'Yoru v3.83.6 W22.4.2' ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'STATUS=PENDING_HUMAN' ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'AI_VALIDATED=14' ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'FALLBACKS=0' ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'DUPLICATE_GROUPS=0' ../fixture_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt

      - name: Generate live non-player W22.4.2 Tier 2 candidates
        working-directory: .ci/v3836_ai_director_context_hardening/runtime
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ai_director_tier2_context_review.py \
            --mode live --model openai/gpt-oss-120b --reasoning-effort low --output ../live_review
          cat ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'STATUS=PENDING_HUMAN' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'TOTAL=14' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'AI_VALIDATED=14' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'FALLBACKS=0' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'DUPLICATE_GROUPS=0' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt
          grep -q 'GAMEPLAY_AUTHORITY=NONE' ../live_review/YORU_AI_DIRECTOR_TIER2_CONTEXT_REVIEW_RESULT.txt

      - name: Compile exact W22.4.2 runtime
        run: |
          python -m compileall -q .ci/v3836_ai_director_context_hardening/runtime .ci/v3836_ai_director_context_hardening/verify_base.py
          echo 'COMPILEALL=PASS' > .ci/v3836_ai_director_context_hardening/compileall.log

      - name: Write W22.4.2 automated result
        run: |
          cat > .ci/v3836_ai_director_context_hardening/W22_4_2_AUTOMATED_RESULT.txt <<'EOF'
          BASE_SOURCE_SHA256=5/5 PASS
          HARDENING_PATCH_SHA256=PASS
          POST_PATCH_SOURCE_SHA256=5/5 PASS
          HUMAN_QA_REGRESSIONS=3/3 ENCODED
          W22_4_2_CI_CORE=30/30 PASS
          FIXTURE_CONTEXT_REVIEW=14/14 PASS
          LIVE_PROVIDER_CANDIDATES=14/14 VALIDATED
          EXACT_DUPLICATES=0
          AUTOMATED_GATE=PENDING_HUMAN
          PLAYER_FACING_SCOPE=TEST_GUILD_ONLY_DEFAULT_OFF
          GAMEPLAY_AUTHORITY=NONE
          LIVE_DEPLOY=UNCHANGED
          W22_4_2_HUMAN_REVIEW=REQUIRED
          EOF

      - name: Upload W22.4.2 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-v3836-w22-4-2-tier2-context-human-qa-hardening
          path: |
            .ci/v3836_ai_director_context_hardening/live_review/
            .ci/v3836_ai_director_context_hardening/fixture_review/
            .ci/v3836_ai_director_context_hardening/base_verify.log
            .ci/v3836_ai_director_context_hardening/post_patch_verify.log
            .ci/v3836_ai_director_context_hardening/core_pytest.log
            .ci/v3836_ai_director_context_hardening/compileall.log
            .ci/v3836_ai_director_context_hardening/W22_4_2_AUTOMATED_RESULT.txt
          if-no-files-found: warn
          retention-days: 30
