name: Yoru v3.73 W12.3 Semantic Skeleton Contracts

on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model ID
        required: true
        default: openai/gpt-oss-120b
      reasoning_effort:
        description: GPT-OSS reasoning effort
        required: true
        type: choice
        options: [low, medium, high]
        default: low
      run_scope:
        description: Canary first; full only after human approval
        required: true
        type: choice
        options: [canary, full]
        default: canary

permissions:
  contents: read
  actions: read

concurrency:
  group: yoru-v373-w123-semantic-skeleton
  cancel-in-progress: false

jobs:
  semantic-skeleton-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: '1'
      ARTIFACT_NAME: yoru-v373-w123-semantic-skeleton-lab
      OUT_DIR: artifacts/ai_semantic_skeleton_lab
      W123_RUN_SCOPE: ${{ inputs.run_scope }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Offline W12.3 preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          {
            echo "W12.3 SHADOW/CANARY/FULL DIAGNOSTICS"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_scope=${W123_RUN_SCOPE}"
            python --version
            sha256sum \
              .ci/v373_ai_grounded_lab/semantic_skeleton_v3.py \
              .ci/v373_ai_grounded_lab/semantic_skeleton_v3_rules.py \
              .ci/v373_ai_grounded_lab/semantic_skeleton_v3_rules_v3.py \
              .ci/v373_ai_grounded_lab/w123_canary.py \
              .ci/v373_ai_grounded_lab/w123_contract_test.py \
              .ci/v373_ai_grounded_lab/w123_contract_test_v4.py
          } | tee "$OUT_DIR/W12_3_EARLY_DIAGNOSTICS.txt"
          python -u .ci/v373_ai_grounded_lab/bootstrap.py --out .ci/v373_ai_grounded_lab/runtime | tee "$OUT_DIR/W12_3_BOOTSTRAP.log"
          python -u .ci/v373_ai_grounded_lab/runtime/contract_test.py | tee "$OUT_DIR/W12_3_FROZEN_CONTRACT_TEST.log"
          python -u .ci/v373_ai_grounded_lab/w123_contract_test.py | tee "$OUT_DIR/W12_3_CONTRACT_TEST.log"
          python -u .ci/v373_ai_grounded_lab/w123_contract_test_v4.py | tee "$OUT_DIR/W12_3_V4_CONTRACT_TEST.log"
          python -u .ci/v373_ai_grounded_lab/w123_shadow_lab.py --out-dir "$OUT_DIR" | tee "$OUT_DIR/W12_3_SHADOW_LAB.log"
          python -u .ci/v373_ai_grounded_lab/w123_checkpoint_migrate_test.py | tee "$OUT_DIR/W12_3_CHECKPOINT_MIGRATION_TEST.log"
          python -m py_compile \
            .ci/v373_ai_grounded_lab/semantic_skeleton_v3.py \
            .ci/v373_ai_grounded_lab/semantic_skeleton_v3_rules.py \
            .ci/v373_ai_grounded_lab/semantic_skeleton_v3_rules_v3.py \
            .ci/v373_ai_grounded_lab/w123_canary.py
          python -u .ci/v373_ai_grounded_lab/semantic_skeleton_v3.py \
            --dry-run --model "${{ inputs.model }}" \
            --reasoning-effort "${{ inputs.reasoning_effort }}" \
            --max-completion-tokens 900 --out-dir "$OUT_DIR" \
            | tee "$OUT_DIR/W12_3_DRY_RUN.log"
          test -n "$GROQ_API_KEY" || { echo "Missing GROQ_API_KEY"; exit 1; }

      - name: Restore and migrate prior checkpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR/checkpoints" /tmp/w123_previous
          prev=$(gh run list --workflow v373-ai-semantic-skeleton-lab.yml --limit 20 --json databaseId --jq '.[].databaseId' | grep -v "^${GITHUB_RUN_ID}$" | head -1 || true)
          if [ -n "$prev" ]; then
            gh run download "$prev" -n "$ARTIFACT_NAME" -D /tmp/w123_previous || true
            find /tmp/w123_previous -type f -path '*/checkpoints/*.json' -exec cp {} "$OUT_DIR/checkpoints/" \; 2>/dev/null || true
          fi
          echo "previous_checkpoint_run_id=${prev:-0}" | tee "$OUT_DIR/W12_3_RESUME.txt"
          python -u .ci/v373_ai_grounded_lab/w123_checkpoint_migrate.py \
            --checkpoint-dir "$OUT_DIR/checkpoints" --out-dir "$OUT_DIR" \
            --model "${{ inputs.model }}" --reasoning-effort "${{ inputs.reasoning_effort }}" \
            | tee "$OUT_DIR/W12_3_CHECKPOINT_MIGRATION_RUN.log"

      - name: Run live scope
        shell: bash
        run: |
          set +e
          if [ "$W123_RUN_SCOPE" = "canary" ]; then
            python -u .ci/v373_ai_grounded_lab/w123_canary.py \
              --model "${{ inputs.model }}" --reasoning-effort "${{ inputs.reasoning_effort }}" \
              --timeout 40 --max-completion-tokens 900 --http-retries 1 \
              --content-retries 1 --rate-floor-tokens 1800 --out-dir "$OUT_DIR" \
              2>&1 | tee "$OUT_DIR/W12_3_CANARY_LIVE.log"
          else
            python -u .ci/v373_ai_grounded_lab/semantic_skeleton_v3.py \
              --model "${{ inputs.model }}" --reasoning-effort "${{ inputs.reasoning_effort }}" \
              --timeout 40 --max-completion-tokens 900 --http-retries 1 \
              --content-retries 0 --repair-rounds 1 --max-wall-seconds 1080 \
              --min-request-budget-seconds 70 --rate-floor-tokens 1800 --out-dir "$OUT_DIR" \
              2>&1 | tee "$OUT_DIR/W12_3_LIVE.log"
          fi
          code=${PIPESTATUS[0]}
          echo "live_runner_exit_code=${code}" | tee -a "$OUT_DIR/W12_3_EARLY_DIAGNOSTICS.txt"
          exit "$code"

      - name: Upload W12.3 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yoru-v373-w123-semantic-skeleton-lab
          path: artifacts/ai_semantic_skeleton_lab/
          if-no-files-found: warn
          retention-days: 14
