name: Yoru v3.75.4 W14.5N Contract Native Closure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yoru-v3754-w14-5n-contract-native-closure
  cancel-in-progress: false

jobs:
  native-contract-closure:
    name: W14.5N native Contract Economy proof
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: yoru_contract_ci_test
          MARIADB_USER: yoru_ci
          MARIADB_PASSWORD: yoru_ci_password
          MARIADB_ROOT_PASSWORD: yoru_ci_root_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout W14.5N clean proof branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3754-w14-5n-clean-source

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install native gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mysql-connector-python>=9.5,<10" "aiosqlite==0.21.0" "pytest>=8,<9" "pytest-asyncio>=0.25,<1"
          python -m pip check

      - name: Run W14.5N native MariaDB certification
        working-directory: .ci/v3754_contract_native_gate
        env:
          YORU_TEST_MYSQL_CONFIRM: DISPOSABLE_SCHEMA
          YORU_TEST_MYSQL_HOST: 127.0.0.1
          YORU_TEST_MYSQL_PORT: ${{ job.services.mariadb.ports['3306'] }}
          YORU_TEST_MYSQL_USER: yoru_ci
          YORU_TEST_MYSQL_PASSWORD: yoru_ci_password
          YORU_TEST_MYSQL_DATABASE: yoru_contract_ci_test
          MYSQL_POOL_SIZE: '8'
          MYSQL_SSL_DISABLED: 'true'
          MYSQL_CONNECT_TIMEOUT_SECONDS: '10'
          MYSQL_POOL_ACQUIRE_TIMEOUT_SECONDS: '8'
          MYSQL_LEGACY_LOCK_TIMEOUT: '15'
        shell: bash
        run: |
          set -o pipefail
          python w14_5n_bootstrap.py 2>&1 | tee W14_5N_NATIVE_RESULT.txt
          grep -Eq '4 passed' W14_5N_NATIVE_RESULT.txt
          grep -Eq 'W14_5N_SOURCE_PROJECTION_VERIFY=PASS' W14_5N_NATIVE_RESULT.txt

      - name: Write proof summary
        if: success()
        working-directory: .ci/v3754_contract_native_gate
        run: |
          printf '%s\n' \
            'YORU v3.75.4 W14.5N' \
            'SOURCE_PROJECTION=PASS' \
            'NATIVE_MARIADB=4/4 PASS' \
            'PHASE4_NATIVE_BLOCKER=CLOSED' \
            > W14_5N_CLOSURE_RESULT.txt

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yoru-v3754-w14-5n-native-proof
          path: |
            .ci/v3754_contract_native_gate/W14_5N_NATIVE_RESULT.txt
            .ci/v3754_contract_native_gate/W14_5N_CLOSURE_RESULT.txt
            .ci/v3754_contract_native_gate/source/W14_5N_SOURCE_PROJECTION_MANIFEST.json
          if-no-files-found: warn
          retention-days: 14
