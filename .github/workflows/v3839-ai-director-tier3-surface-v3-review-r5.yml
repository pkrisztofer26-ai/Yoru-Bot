name: Yoru v3.83.9 W22.5.1.1 Tier 3 Canonical Direct-Frozen Review R5
run-name: W22.5.1.1 Tier 3 canonical direct-frozen review R5

on:
  push:
    branches:
      - ci/v3839-ai-director-tier3-surface-v3-review
    paths:
      - .ci/v3839_ai_director_game_master/TRIGGER_R5

permissions:
  contents: read

jobs:
  tier3-surface-v3-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical direct-frozen proof branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3839-ai-director-tier3-surface-v3-review

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Build canonical direct-frozen v3.83.9 runtime
        run: |
          set -euo pipefail
          GATE=.ci/v3839_ai_director_game_master
          SRC="$GATE/frozen"
          COMMON=.ci/v3831_ai_director_review/frozen
          RUN="$GATE/runtime_r5"
          rm -rf "$RUN"
          mkdir -p "$RUN/app/providers" "$RUN/app/services" "$RUN/scripts" "$RUN/tests"
          touch "$RUN/app/__init__.py" "$RUN/app/providers/__init__.py" "$RUN/app/services/__init__.py"
          cp "$COMMON/app/ai_director.py" "$RUN/app/ai_director.py"
          cp "$COMMON/app/ai_director_config.py" "$RUN/app/ai_director_config.py"
          cp "$COMMON/app/providers/ai_director_groq.py" "$RUN/app/providers/ai_director_groq.py"
          cp "$SRC/app/ai_director_game_master.py" "$RUN/app/ai_director_game_master.py"
          cp "$SRC/app/services/ai_director_game_master.py" "$RUN/app/services/ai_director_game_master.py"
          cp "$SRC/app/providers/ai_director_game_master_groq.py" "$RUN/app/providers/ai_director_game_master_groq.py"
          cp "$SRC/scripts/ai_director_tier3_game_master_review.py" "$RUN/scripts/ai_director_tier3_game_master_review.py"
          cp "$SRC/tests/test_w22_5_game_master_ci.py" "$RUN/tests/test_w22_5_game_master_ci.py"

      - name: Record canonical source SHA 8/8
        run: |
          set -euo pipefail
          R=.ci/v3839_ai_director_game_master/runtime_r5
          sha256sum \
            "$R/app/ai_director.py" \
            "$R/app/ai_director_config.py" \
            "$R/app/providers/ai_director_groq.py" \
            "$R/app/ai_director_game_master.py" \
            "$R/app/services/ai_director_game_master.py" \
            "$R/app/providers/ai_director_game_master_groq.py" \
            "$R/scripts/ai_director_tier3_game_master_review.py" \
            "$R/tests/test_w22_5_game_master_ci.py" \
            | tee .ci/v3839_ai_director_game_master/source_sha_r5.log
          test "$(wc -l < .ci/v3839_ai_director_game_master/source_sha_r5.log)" -eq 8
          echo 'CANONICAL_SOURCE_SHA=8/8 RECORDED'

      - name: Install proof dependency
        run: python -m pip install 'pytest>=8,<10'

      - name: Run targeted Tier 3 v3 contracts
        working-directory: .ci/v3839_ai_director_game_master/runtime_r5
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_w22_5_game_master_ci.py | tee ../core_pytest_r5.log
          grep -Eq '34 passed' ../core_pytest_r5.log
          if grep -Eqi '[1-9][0-9]* skipped|[1-9][0-9]* failed|[1-9][0-9]* error' ../core_pytest_r5.log; then exit 1; fi

      - name: Run deterministic effective-surface fixture review
        working-directory: .ci/v3839_ai_director_game_master/runtime_r5
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ai_director_tier3_game_master_review.py --mode fixture --output ../fixture_review_r5
          cat ../fixture_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'Yoru v3.83.9 W22.5.1.1' ../fixture_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'TOTAL=12' ../fixture_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'EFFECTIVE_VALIDATED=12' ../fixture_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'GAMEPLAY_AUTHORITY=NONE' ../fixture_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt

      - name: Generate live non-player effective surfaces
        working-directory: .ci/v3839_ai_director_game_master/runtime_r5
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ai_director_tier3_game_master_review.py --mode live --model openai/gpt-oss-120b --reasoning-effort low --output ../live_review_r5
          cat ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'STATUS=PENDING_HUMAN' ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'TOTAL=12' ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'EFFECTIVE_VALIDATED=12' ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'GAMEPLAY_AUTHORITY=NONE' ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt
          grep -q 'LIVE_DEPLOY=UNCHANGED' ../live_review_r5/YORU_AI_DIRECTOR_TIER3_GAME_MASTER_REVIEW_RESULT.txt

      - name: Compile canonical runtime and write result
        run: |
          set -euo pipefail
          python -m compileall -q .ci/v3839_ai_director_game_master/runtime_r5
          echo 'COMPILEALL=PASS' > .ci/v3839_ai_director_game_master/compileall_r5.log
          cat > .ci/v3839_ai_director_game_master/W22_5_1_1_AUTOMATED_RESULT_R5.txt <<'EOF'
          CANONICAL_SOURCE_SHA=8/8 RECORDED
          W22_5_1_1_CI_TARGETED=34/34 PASS
          LOCAL_RELEASE_DEDICATED_PRE_FREEZE=70/70 PASS
          PHASE12_W22_PRE_FREEZE=206/206 PASS
          FIXTURE_EFFECTIVE_SURFACES=12/12 VALIDATED
          LIVE_EFFECTIVE_SURFACES=12/12 VALIDATED
          AI_FALLBACK_RATIO=OBSERVED_ONLY
          AUTOMATED_GATE=PENDING_HUMAN
          PLAYER_FACING_AI=OFF
          RUNTIME_WIRING=NONE
          GAMEPLAY_AUTHORITY=NONE
          LIVE_DEPLOY=UNCHANGED
          EOF

      - name: Upload W22.5.1.1 R5 canonical proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-v3839-w22-5-1-1-tier3-canonical-review-r5
          path: |
            .ci/v3839_ai_director_game_master/runtime_r5/
            .ci/v3839_ai_director_game_master/live_review_r5/
            .ci/v3839_ai_director_game_master/fixture_review_r5/
            .ci/v3839_ai_director_game_master/source_sha_r5.log
            .ci/v3839_ai_director_game_master/core_pytest_r5.log
            .ci/v3839_ai_director_game_master/compileall_r5.log
            .ci/v3839_ai_director_game_master/W22_5_1_1_AUTOMATED_RESULT_R5.txt
          if-no-files-found: warn
          retention-days: 30
