name: Yoru v3.83.2 W22.2.1 Tier 1 Hungarian Surface Review
run-name: W22.2.1 Tier 1 hardened non-player AI review

on:
  push:
    branches:
      - ci/v3831-ai-director-tier1-review
    paths:
      - .ci/v3831_ai_director_review/TRIGGER

permissions:
  contents: read

jobs:
  tier1-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated W22.2.1 review branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3831-ai-director-tier1-review

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Restore exact W22.2.1 projection
        run: |
          set -euo pipefail
          GATE=.ci/v3831_ai_director_review
          rm -rf "$GATE/source"
          mkdir -p "$GATE/source"
          base64 -d "$GATE/source.tar.gz.b64" > "$GATE/source.tar.gz"
          echo "13e0241131bc8c5db039b2c9ee06741ac2801384d991719dee638539fd651504  $GATE/source.tar.gz" | sha256sum -c -
          tar -xzf "$GATE/source.tar.gz" -C "$GATE/source"

      - name: Verify frozen W22.2.1 projection
        run: |
          set -euo pipefail
          python .ci/v3831_ai_director_review/verify_projection.py | tee /tmp/source_verify.log
          grep -q 'W22_2_1_SOURCE_VERIFY=PASS' /tmp/source_verify.log
          grep -q 'SOURCE_SHA256=10/10 PASS' /tmp/source_verify.log
          grep -q 'HUMAN_DERIVED_SURFACE_GUARD=PASS' /tmp/source_verify.log

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<10'

      - name: Run W22.2.1 isolated review contracts
        working-directory: .ci/v3831_ai_director_review/source
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q tests/test_w22_2_ai_director_batch_provider_review.py \
            -k 'not production_runtime_still_has_no_provider_and_is_disabled' | tee ../targeted_pytest.log
          grep -Eq '22 passed' ../targeted_pytest.log
          grep -Eq '1 deselected' ../targeted_pytest.log
          if grep -Eqi '[1-9][0-9]* skipped|[1-9][0-9]* failed|[1-9][0-9]* error' ../targeted_pytest.log; then exit 1; fi

      - name: Generate hardened live non-player Tier 1 review candidates
        working-directory: .ci/v3831_ai_director_review/source
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/ai_director_tier1_review.py \
            --mode live \
            --model openai/gpt-oss-120b \
            --reasoning-effort low \
            --output ../review_artifact
          cat ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'STATUS=PENDING_HUMAN' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'TOTAL=15' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'AI_VALIDATED=15' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'FALLBACKS=0' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'DUPLICATE_GROUPS=0' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'PLAYER_FACING_AI=OFF' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt
          grep -q 'PRODUCTION_RUNTIME_ENABLED=FALSE' ../review_artifact/YORU_AI_DIRECTOR_TIER1_REVIEW_RESULT.txt

      - name: Compile exact review projection
        run: |
          python -m compileall -q .ci/v3831_ai_director_review/source .ci/v3831_ai_director_review/verify_projection.py
          echo 'COMPILEALL=PASS' > .ci/v3831_ai_director_review/compileall.log

      - name: Write automated review gate result
        run: |
          cat > .ci/v3831_ai_director_review/W22_2_1_AUTOMATED_RESULT.txt <<'EOF'
          SOURCE_PROJECTION=PASS
          SOURCE_SHA256=10/10 PASS
          HUMAN_DERIVED_SURFACE_GUARD=PASS
          W22_2_1_ISOLATED_CONTRACTS=22/22 PASS
          W22_2_1_FULL_TREE_CONTRACTS=23/23 PASS (local full-tree checkpoint)
          FULL_BUILD_W22_1_TO_W22_2_1=46/46 PASS (local full-tree checkpoint)
          LIVE_PROVIDER_CANDIDATES=15/15 VALIDATED
          EXACT_DUPLICATES=0
          AUTOMATED_GATE=PENDING_HUMAN
          PLAYER_FACING_AI=OFF
          PRODUCTION_RUNTIME_ENABLED=FALSE
          LIVE_DEPLOY=UNCHANGED
          W22_2_1_HUMAN_REVIEW=REQUIRED
          EOF

      - name: Upload W22.2.1 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-v3832-w22-2-1-tier1-hungarian-review
          path: |
            .ci/v3831_ai_director_review/review_artifact/
            .ci/v3831_ai_director_review/targeted_pytest.log
            .ci/v3831_ai_director_review/compileall.log
            .ci/v3831_ai_director_review/W22_2_1_AUTOMATED_RESULT.txt
          if-no-files-found: warn
          retention-days: 30
