name: Yoru v3.72 Native MariaDB Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yoru-v372-native-mariadb-gate
  cancel-in-progress: false

jobs:
  native-mariadb-gate:
    name: Native MariaDB / InnoDB + W10 transaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: yoru_ci_test
          MARIADB_USER: yoru_ci
          MARIADB_PASSWORD: yoru_ci_password
          MARIADB_ROOT_PASSWORD: yoru_ci_root_password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mysql-connector-python>=9.5,<10" "aiosqlite>=0.20,<1"

      - name: Run infrastructure MariaDB gate
        working-directory: .ci/v372_mysql_gate
        env:
          YORU_CI_DB_HOST: 127.0.0.1
          YORU_CI_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          YORU_CI_DB_NAME: yoru_ci_test
          YORU_CI_DB_USER: yoru_ci
          YORU_CI_DB_PASSWORD: yoru_ci_password
          YORU_CI_POOL_SIZE: '4'
        run: python runner.py

      - name: Run W10 real Yoru wallet/casino/crew/market contracts
        working-directory: .ci/v372_mysql_gate
        env:
          YORU_DB_BACKEND: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: ${{ job.services.mariadb.ports['3306'] }}
          MYSQL_DATABASE: yoru_ci_test
          MYSQL_USER: yoru_ci
          MYSQL_PASSWORD: yoru_ci_password
          MYSQL_POOL_SIZE: '8'
          MYSQL_POOL_NAME: yoru-w10-core
          MYSQL_SSL_DISABLED: 'true'
        run: python w10_bootstrap_runner.py

      - name: Reset ephemeral schema before isolated W10.2 Heist gate
        working-directory: .ci/v372_mysql_gate
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: ${{ job.services.mariadb.ports['3306'] }}
          MYSQL_DATABASE: yoru_ci_test
          MYSQL_USER: yoru_ci
          MYSQL_PASSWORD: yoru_ci_password
        run: python w10_reset_schema.py

      - name: Run W10.2 real Yoru Heist transaction contracts
        working-directory: .ci/v372_mysql_gate
        env:
          YORU_DB_BACKEND: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: ${{ job.services.mariadb.ports['3306'] }}
          MYSQL_DATABASE: yoru_ci_test
          MYSQL_USER: yoru_ci
          MYSQL_PASSWORD: yoru_ci_password
          MYSQL_POOL_SIZE: '8'
          MYSQL_POOL_NAME: yoru-w10-heist
          MYSQL_SSL_DISABLED: 'true'
        run: python w10_heist_canonical_runner.py

      - name: Print all gate reports
        if: always()
        working-directory: .ci/v372_mysql_gate
        run: |
          for report in \
            YORU_MYSQL_GATE_RESULT.txt \
            YORU_W10_TRANSACTION_CONTRACT_RESULT.txt \
            YORU_W10_HEIST_CONTRACT_RESULT.txt; do
            echo "============================================================"
            echo "$report"
            echo "============================================================"
            if [ -f "$report" ]; then
              cat "$report"
            else
              echo "Result file was not created."
            fi
          done

      - name: Upload complete W10 gate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yoru-v372-w10-native-mariadb-gate-result
          path: |
            .ci/v372_mysql_gate/YORU_MYSQL_GATE_RESULT.json
            .ci/v372_mysql_gate/YORU_MYSQL_GATE_RESULT.txt
            .ci/v372_mysql_gate/YORU_W10_TRANSACTION_CONTRACT_RESULT.json
            .ci/v372_mysql_gate/YORU_W10_TRANSACTION_CONTRACT_RESULT.txt
            .ci/v372_mysql_gate/YORU_W10_HEIST_CONTRACT_RESULT.json
            .ci/v372_mysql_gate/YORU_W10_HEIST_CONTRACT_RESULT.txt
          if-no-files-found: warn
          retention-days: 7
