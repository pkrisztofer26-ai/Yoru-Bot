name: Yoru v3.82.1 W21.2 Chapter Signal Native Gate
run-name: v3.82.1 W21.2 Chapter Signal Native Gate — manual

on:
  workflow_dispatch:

jobs:
  chapter-signal-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: yoru_v3821_signal
          MARIADB_USER: yoru_ci
          MARIADB_PASSWORD: yoru_ci_password
          MARIADB_ROOT_PASSWORD: yoru_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout frozen W21.2 proof branch
        uses: actions/checkout@v6
        with:
          ref: ci/v3821-chapter-signal-native

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .ci/v3821_chapter_signal_native/source/requirements.txt

      - name: Verify frozen W21.2 source identity
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/v3821_chapter_signal_native
          sha256sum -c SOURCE_SHA256SUMS
          echo 'W21_2_SOURCE_IDENTITY=PASS'

      - name: Install native proof dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .ci/v3821_chapter_signal_native/source/requirements.txt

      - name: Run native MariaDB signal aggregation proof
        shell: bash
        env:
          YORU_DB_BACKEND: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: yoru_v3821_signal
          MYSQL_USER: yoru_ci
          MYSQL_PASSWORD: yoru_ci_password
          MYSQL_SSL_DISABLED: 'true'
        run: |
          set -euo pipefail
          GATE=.ci/v3821_chapter_signal_native
          mkdir -p "$GATE/proof_artifacts"
          cd "$GATE/source"
          PYTHONPATH=. pytest -q --asyncio-mode=auto tests | tee ../proof_artifacts/native_pytest.log
          grep -Eq '6 passed' ../proof_artifacts/native_pytest.log
          if grep -Eqi '[1-9][0-9]* skipped|[1-9][0-9]* failed|[1-9][0-9]* error' ../proof_artifacts/native_pytest.log; then
            exit 1
          fi

      - name: Compile frozen W21.2 projection
        run: |
          python -m compileall -q .ci/v3821_chapter_signal_native/source/app
          echo 'COMPILEALL=PASS' | tee .ci/v3821_chapter_signal_native/proof_artifacts/compileall.log

      - name: Write W21.2 native result
        shell: bash
        run: |
          cat > .ci/v3821_chapter_signal_native/proof_artifacts/V3821_W21_2_NATIVE_RESULT.txt <<'EOF'
          SOURCE_IDENTITY=PASS
          NATIVE_MARIADB=6/6 PASS
          HISTORY_TABLES_INNODB=PASS
          REPLAY_STABLE_AGGREGATION=PASS
          COMMITTED_SOURCE_MAPPING=PASS
          NORMALIZATION_100=PASS
          ENDING_HARD_CAP_65=PASS
          READ_ONLY_CHAPTER_STATE=PASS
          NO_SCORE_CHOICE_REWARD_TABLES=PASS
          COMPILEALL=PASS
          W21_2_NATIVE_GATE=PASS
          EOF

      - name: Upload W21.2 native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoru-v3821-w21-2-chapter-signal-native-proof
          path: .ci/v3821_chapter_signal_native/proof_artifacts/
          if-no-files-found: warn
          retention-days: 30
